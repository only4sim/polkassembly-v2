# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

# Environment variables and secrets.
env:
  # DemoOS mode: disable blockchain integration
  - variable: ENABLE_BLOCKCHAIN
    value: "false"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_ENABLE_BLOCKCHAIN
    value: "false"
    availability:
      - BUILD
      - RUNTIME
  # Disable features not needed for DemoOS
  - variable: ENABLE_INDEXERS
    value: "false"
    availability:
      - BUILD
      - RUNTIME
  - variable: ENABLE_REDIS
    value: "false"
    availability:
      - BUILD
      - RUNTIME
